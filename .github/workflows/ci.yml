# Runs the AI service's and the backend's tests on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      # CPU-only torch: the GPU build is several GB and the tests don't need it.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r ai/requirements.txt
      # The tests run without the embedding model (see ai/tests/conftest.py).
      - run: python -m pytest ai/tests -q

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: founderslink
          POSTGRES_PASSWORD: founderslink
          POSTGRES_DB: founderslink_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U founderslink" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://founderslink:founderslink@localhost:5432/founderslink_test
      JWT_SECRET: ci-only-jwt-secret-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      # The tests use the demo funders and compliance items (backend/README.md).
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test

  docker:
    # Checks that the images still build, so `docker compose up` keeps working.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend
