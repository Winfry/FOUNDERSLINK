# The live FoundersLink backend on Render, as a Blueprint: in Render,
# New > Blueprint, pick this repository, and Render reads this file.
# Step by step, and what to do before real members join: docs/GO_LIVE.md.
#
# The database is not here: it lives on Neon or Supabase (Render's free
# database is deleted after a while). Paste its address into DATABASE_URL
# when Render asks. The AI service is not here either: on the free plan
# the backend uses its own rule-based stand-in, by design.

services:
  - type: web
    name: founderslink-api
    runtime: docker
    plan: free
    # The closest Render region to Kenya.
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # No demo accounts or made-up funders on a live server.
      - key: LOAD_DEMO_DATA
        value: "false"
      # Render puts one proxy in front of the server.
      - key: TRUST_PROXY
        value: "1"
      - key: SHOW_DEMO_CODES
        value: "false"
      # The live app on Netlify. Comma-separate to add more.
      - key: CORS_ORIGIN
        value: https://founderslink-app.netlify.app
      # Generated by Render once, then kept: changing them signs everyone
      # out (JWT_SECRET) or makes stored files unreadable (the upload key).
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_ENCRYPTION_KEY
        generateValue: true
      # Asked for when the Blueprint is created.
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
